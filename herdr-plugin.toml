id = "convo.index"
name = "Conversation Index"
version = "0.6.1"
min_herdr_version = "0.7.0"
description = "Turn index for the focused Claude Code or Codex pane, docked as a side pane; click a turn to read it in full."
platforms = ["macos", "linux"]

[[panes]]
id = "index"
# herdr paints this on the pane border and rejects an empty one, so it is a
# single dot rather than a name repeated beside every row of the index.
title = "·"
placement = "split"
command = ["python3", "bin/convo_index.py"]

# Placement is set when the pane is opened rather than declared here: the
# manifest parser in herdr 0.7.x rejects "popup" as a manifest-level placement,
# while plugin.pane.open accepts it. The index always opens this entrypoint as
# an 80%x80% popup.
[[panes]]
id = "turn"
title = "Conversation Turn"
command = ["python3", "bin/turn_view.py"]

[[actions]]
id = "toggle"
title = "Toggle conversation index"
contexts = ["pane"]
command = ["python3", "bin/toggle.py"]
